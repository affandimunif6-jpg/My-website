
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Dodge</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#050b18;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}
h2{color:#00dfff;margin:15px}
#score{color:#8bcfff;margin:12px}
canvas{
  display:block;
  width:min(94vw,420px);
  height:min(94vw,420px);
  max-height:55vh;
  margin:auto;
  background:#0a1830;
  border:1px solid #008dff;
  touch-action:none;
}
button{
  background:#00dfff;
  color:#00111c;
  padding:13px 25px;
  border:0;
  border-radius:6px;
  font-weight:bold;
  margin:12px;
}
</style>
</head>

<body>
<h2>NEON DODGE</h2>
<div id="score">Score: 0</div>
<canvas id="game" width="420" height="420"></canvas>
<button id="start">START GAME</button>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let player={x:190,y:365,w:38,h:25};
let obstacles=[];
let score=0;
let running=false;
let over=false;
let frame=0;
let keys={};

function draw(){
  ctx.clearRect(0,0,420,420);

  ctx.fillStyle="#00e5ff";
  ctx.shadowColor="#00aaff";
  ctx.shadowBlur=15;
  ctx.fillRect(player.x,player.y,player.w,player.h);

  ctx.fillStyle="#ff326b";
  ctx.shadowColor="#ff004c";

  obstacles.forEach(o=>{
    ctx.fillRect(o.x,o.y,o.size,o.size);
  });

  ctx.shadowBlur=0;

  if(over){
    ctx.fillStyle="white";
    ctx.font="bold 30px Arial";
    ctx.textAlign="center";
    ctx.fillText("GAME OVER",210,190);
    ctx.font="16px Arial";
    ctx.fillText("Press START to retry",210,225);
  }
}

function update(){
  if(!running)return;

  if(keys.left)player.x-=6;
  if(keys.right)player.x+=6;

  player.x=Math.max(0,Math.min(382,player.x));

  frame++;

  if(frame%42===0){
    obstacles.push({
      x:Math.random()*390,
      y:-25,
      size:22,
      speed:3+Math.min(score*.03,4)
    });
  }

  for(const o of obstacles){
    o.y+=o.speed;

    if(
      player.x<o.x+o.size &&
      player.x+player.w>o.x &&
      player.y<o.y+o.size &&
      player.y+player.h>o.y
    ){
      running=false;
      over=true;
    }
  }

  obstacles=obstacles.filter(o=>o.y<420);
  score++;

  document.getElementById("score").textContent=
    "Score: "+score;

  draw();
}

function loop(){
  update();
  requestAnimationFrame(loop);
}

document.getElementById("start").onclick=()=>{
  player.x=190;
  obstacles=[];
  score=0;
  frame=0;
  over=false;
  running=true;
  draw();
};

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft")keys.left=true;
  if(e.key==="ArrowRight")keys.right=true;
});

document.addEventListener("keyup",e=>{
  if(e.key==="ArrowLeft")keys.left=false;
  if(e.key==="ArrowRight")keys.right=false;
});

let dragging=false;

canvas.addEventListener("pointerdown",e=>{
  dragging=true;
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener("pointermove",e=>{
  if(!dragging||!running)return;
  const rect=canvas.getBoundingClientRect();
  player.x=(e.clientX-rect.left)*420/rect.width-player.w/2;
  player.x=Math.max(0,Math.min(382,player.x));
});

canvas.addEventListener("pointerup",()=>dragging=false);
canvas.addEventListener("pointercancel",()=>dragging=false);

draw();
loop();
</script>
</body>
</html>
